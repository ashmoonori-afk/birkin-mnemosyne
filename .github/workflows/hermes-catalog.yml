name: hermes-catalog

# Temporary diagnostic branch only. This run reports permission aggregates,
# never credential values. Run-specific reference probes are removed after
# verifying their SHA; catalog files, main, PRs and PyPI are never changed.

# Proposes a SHA-bump PR for plugin-catalog/birkin-mnemosyne.yaml in
# NousResearch/hermes-agent. release.yml calls this only after its PyPI publish
# job succeeded. Run it by hand to dry-run or retry a release; this workflow
# never builds or publishes anything to PyPI. See docs/hermes-catalog-automation.md.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    secrets:
      HERMES_CATALOG_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag, e.g. v0.7.0"
        type: string
        required: true
      dry_run:
        description: "Read only: print the catalog diff, open nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hermes-catalog-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  catalog-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Controlled catalog reference diagnosis
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          HERMES_CATALOG_TOKEN: ${{ !inputs.dry_run && secrets.HERMES_CATALOG_TOKEN || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          token = os.environ["HERMES_CATALOG_TOKEN"]
          if not token:
              raise SystemExit("CATALOG_DIAGNOSTIC_SECRET_ABSENT")
          family = (
              "classic" if token.startswith("ghp_") else
              "fine-grained" if token.startswith("github_pat_") else
              "oauth" if token.startswith("gho_") else "other"
          )
          report = {"diagnostic_only": True, "token_family": family}
          def github(method: str, path: str, payload: dict[str, Any] | None = None) -> tuple[int, Any, str, str]:
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request("https://api.github.com" + path, data=data, method=method)
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              request.add_header("User-Agent", "birkin-mnemosyne-catalog-diagnostic")
              request.add_header("Authorization", "Bearer " + token)
              if data is not None:
                  request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      scopes = response.headers.get("X-OAuth-Scopes", "")
                      accepted = response.headers.get("X-Accepted-GitHub-Permissions", "")
                      raw = response.read()
              except urllib.error.HTTPError as response:
                  status = response.code
                  scopes = response.headers.get("X-OAuth-Scopes", "")
                  accepted = response.headers.get("X-Accepted-GitHub-Permissions", "")
                  raw = response.read()
                  response.close()
              return status, json.loads(raw) if raw else {}, scopes, accepted

          for kind, path in (
              ("actor", "/user"),
              ("fork", "/repos/ashmoonori-afk/hermes-agent"),
          ):
              status, body, scopes, _ = github("GET", path)
              scope_set = {scope.strip() for scope in scopes.split(",") if scope.strip()}
              report[kind + "_http_status"] = status
              if kind == "actor":
                  report["actor_matches_fork_owner"] = body.get("login") == "ashmoonori-afk"
                  report["classic_public_write_scope"] = bool(
                      scope_set.intersection({"public_repo", "repo"})
                  )
                  report["classic_workflow_scope"] = "workflow" in scope_set
              else:
                  report["fork_is_correct"] = body.get("full_name") == "ashmoonori-afk/hermes-agent"
                  report["actor_has_fork_push"] = bool(body.get("permissions", {}).get("push"))
                  report["fork_archived"] = body.get("archived")
          if not all(report[key] for key in (
              "actor_matches_fork_owner", "classic_public_write_scope", "fork_is_correct",
          )):
              print("CATALOG_ACCESS_DIAGNOSTIC " + json.dumps(report, sort_keys=True))
              raise SystemExit("Credential changed; no reference probes performed.")

          fork = "/repos/ashmoonori-afk/hermes-agent"
          status, main_ref, _, _ = github("GET", fork + "/git/ref/heads/main")
          if status != 200:
              raise SystemExit("Fork main is not readable; no reference probes performed.")
          fork_sha = main_ref["object"]["sha"]
          upstream_sha = "4957bbd0a0f6a1c3fe8217dc4a66d072971f5b63"
          workflow_sets = []
          for sha in (fork_sha, upstream_sha):
              status, files, _, _ = github(
                  "GET", "/repos/NousResearch/hermes-agent/contents/.github/workflows?ref=" + sha,
              )
              workflow_sets.append(
                  sorted((item["name"], item["sha"]) for item in files) if status == 200 else None
              )
          report["workflow_snapshots_readable"] = all(item is not None for item in workflow_sets)
          report["workflow_snapshot_changes"] = workflow_sets[0] != workflow_sets[1]
          probes = []
          for label, sha in (("fork", fork_sha), ("upstream", upstream_sha)):
              branch = "catalog/birkin-mnemosyne-v0.7.1-probe-" + label + "-" + os.environ["GITHUB_RUN_ID"]
              encoded = urllib.parse.quote(branch, safe="")
              status, _, _, _ = github("GET", fork + "/git/ref/heads/" + encoded)
              if status != 404:
                  raise SystemExit("Probe name already exists or is not readable; refusing any write.")
              status, body, _, accepted = github(
                  "POST", fork + "/git/refs", {"ref": "refs/heads/" + branch, "sha": sha},
              )
              probe = {"base": label, "create_http_status": status,
                       "accepted_workflow_permission": "workflows" in accepted}
              if status == 201:
                  current_status, current, _, _ = github("GET", fork + "/git/ref/heads/" + encoded)
                  if current_status != 200 or current["object"]["sha"] != sha:
                      raise SystemExit("Probe changed unexpectedly; refusing deletion.")
                  deleted, _, _, _ = github("DELETE", fork + "/git/refs/heads/" + encoded)
                  probe["delete_http_status"] = deleted
                  if deleted != 204:
                      raise SystemExit("Owned probe cleanup failed.")
              probes.append(probe)
          report["reference_probes"] = probes
          print("CATALOG_ACCESS_DIAGNOSTIC " + json.dumps(report, sort_keys=True))
          PY
