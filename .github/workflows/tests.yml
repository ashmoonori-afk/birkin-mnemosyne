name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (stdlib only, ${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - name: Verify minimal dependency fallback before installing integration extras
        run: python -m pytest -q tests/test_semantic_fallback.py
      - name: Install optional integration test dependencies
        run: python -m pip install -e ".[semantic]"
      - run: python -m pytest -q

  mcp:
    name: mcp extra (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[mcp]" pytest
      - name: Install optional integration test dependencies
        run: python -m pip install -e ".[semantic]"
      - run: python -m pytest -q

  semantic:
    name: semantic extra (${{ matrix.os }}, py3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[semantic]" pytest
      - run: python -m pytest -q
