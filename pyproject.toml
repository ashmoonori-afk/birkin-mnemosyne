[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "birkin-mnemosyne"
version = "0.1.0"
description = "Zero-dependency memory palace + safe model-agnostic curation for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Birkin project" }]
keywords = ["llm", "agent", "memory", "rag", "bm25", "curation", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = []                                    # stdlib only — the point

[project.optional-dependencies]
dev = ["pytest", "ruff"]
bench = ["fastembed", "numpy"]                        # embedding baselines only

[project.urls]
Homepage = "https://github.com/ashmoonori/birkin-mnemosyne"
Source = "https://github.com/ashmoonori/birkin-mnemosyne"

[tool.setuptools]
packages = ["birkin_mnemosyne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
